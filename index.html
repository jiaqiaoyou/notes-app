<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="笔记" />
  <meta name="theme-color" content="#f7f4ef" />
  <meta name="description" content="简洁纯文字笔记" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <title>笔记</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- List view -->
    <section id="view-list" class="view" aria-label="笔记列表">
      <header class="topbar">
        <h1 class="title">笔记</h1>
        <button type="button" id="btn-new" class="btn btn-primary" aria-label="新建笔记">新建</button>
      </header>
      <div class="search-wrap">
        <input type="search" id="search" class="search" placeholder="搜索…" enterkeyhint="search" autocomplete="off" />
      </div>
      <ul id="note-list" class="note-list" role="list"></ul>
      <p id="empty-state" class="empty hidden">还没有笔记。点右上角「新建」开始写。</p>
    </section>

    <!-- Editor view -->
    <section id="view-editor" class="view hidden" aria-label="编辑笔记">
      <header class="topbar">
        <button type="button" id="btn-back" class="btn btn-ghost" aria-label="返回列表">‹ 返回</button>
        <div class="topbar-actions">
          <button type="button" id="btn-delete" class="btn btn-danger" aria-label="删除笔记">删除</button>
          <button type="button" id="btn-save" class="btn btn-primary" aria-label="保存笔记">保存</button>
        </div>
      </header>
      <input type="text" id="note-title" class="note-title" placeholder="标题" maxlength="120" autocomplete="off" />
      <textarea id="note-body" class="note-body" placeholder="开始写吧…" enterkeyhint="enter"></textarea>
      <p id="save-hint" class="save-hint" aria-live="polite"></p>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
