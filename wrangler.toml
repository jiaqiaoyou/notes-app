name = "notes-app"
main = "src/worker.js"
compatibility_date = "2026-10-11"
workers_dev = true

# For local/wrangler asset deploy (production currently embeds static in Worker bundle)
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "notes-app-db"
database_id = "558906db-16b9-4485-8c64-739640b6d11e"
